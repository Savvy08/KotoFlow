name: Build KotoFlow Windows Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter (3.27.4)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust & Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/rust-lib -> ../target

      - name: Install Build Tools
        shell: bash
        run: |
          choco install protoc -y
          cargo install --force --locked cargo-make
          cargo install --force --locked duckscript_cli
          flutter config --enable-windows-desktop
          dart pub global activate protoc_plugin 21.1.2
          echo "$LOCALAPPDATA/Pub/Cache/bin" >> $GITHUB_PATH
          echo "$USERPROFILE/.cargo/bin" >> $GITHUB_PATH

      - name: Build KotoFlow for Windows
        shell: bash
        working-directory: frontend
        run: |
          cargo make --profile production-windows-x86 appflowy-windows

      - name: Archive Windows Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Write-Host "Searching for compiled Windows binary..."
          $exe = Get-ChildItem -Path . -Recurse -File | Where-Object { $_.Extension -eq ".exe" -and ($_.Name -like "*flowy*" -or $_.Name -like "*koto*") } | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path . -Recurse -File | Where-Object { $_.Extension -eq ".exe" } | Select-Object -First 1
          }
          if ($exe) {
            $releaseDir = $exe.DirectoryName
            Write-Host "Found executable at: $releaseDir"
            Get-ChildItem -Path $releaseDir
            Compress-Archive -Path "$releaseDir\*" -DestinationPath "dist\KotoFlow-Windows-x64.zip" -Force
            $zipItem = Get-Item "dist\KotoFlow-Windows-x64.zip"
            Write-Host "Created zip archive of size: $($zipItem.Length) bytes"
          } else {
            $relDir = Get-ChildItem -Path . -Recurse -Directory | Where-Object { $_.Name -eq "Release" } | Select-Object -First 1
            if ($relDir) {
              Write-Host "Found Release directory at: $($relDir.FullName)"
              Compress-Archive -Path "$($relDir.FullName)\*" -DestinationPath "dist\KotoFlow-Windows-x64.zip" -Force
            } else {
              Write-Error "Could not find build output directory!"
              exit 1
            }
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KotoFlow-Windows-x64
          path: dist/KotoFlow-Windows-x64.zip
          retention-days: 14
