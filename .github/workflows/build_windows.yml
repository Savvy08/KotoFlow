name: Build KotoFlow Windows Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter (3.27.4)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust & Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/rust-lib -> ../target

      - name: Install Build Tools
        shell: bash
        run: |
          choco install protoc -y
          cargo install --force --locked cargo-make
          cargo install --force --locked duckscript_cli
          flutter config --enable-windows-desktop
          dart pub global activate protoc_plugin 21.1.2
          echo "$LOCALAPPDATA/Pub/Cache/bin" >> $GITHUB_PATH
          echo "$USERPROFILE/.cargo/bin" >> $GITHUB_PATH

      - name: Build KotoFlow for Windows
        shell: bash
        working-directory: frontend
        run: |
          cargo make --profile production-windows-x86 appflowy-windows

      - name: Archive Windows Release
        shell: bash
        run: |
          mkdir -p dist
          if [ -d "frontend/appflowy_flutter/build/windows/x64/runner/Release" ]; then
            echo "Archiving from build/windows/x64/runner/Release..."
            cd frontend/appflowy_flutter/build/windows/x64/runner/Release
            7z a -tzip -mx=9 "$GITHUB_WORKSPACE/dist/KotoFlow-Windows-x64.zip" *
          elif [ -d "frontend/appflowy_flutter/product" ]; then
            echo "Archiving from product directory..."
            cd frontend/appflowy_flutter/product
            7z a -tzip -mx=9 "$GITHUB_WORKSPACE/dist/KotoFlow-Windows-x64.zip" *
          else
            echo "Locating built executable directory..."
            EXE_DIR=$(find frontend/appflowy_flutter/build -name "AppFlowy.exe" -exec dirname {} \; | head -n 1)
            if [ -n "$EXE_DIR" ] && [ -d "$EXE_DIR" ]; then
              cd "$EXE_DIR"
              7z a -tzip -mx=9 "$GITHUB_WORKSPACE/dist/KotoFlow-Windows-x64.zip" *
            fi
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KotoFlow-Windows-x64
          path: dist/KotoFlow-Windows-x64.zip
          retention-days: 14
