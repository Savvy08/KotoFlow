name: Build KotoFlow Windows Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter (3.27.4)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust & Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/rust-lib -> ../target

      - name: Install Build Tools
        shell: bash
        run: |
          choco install protoc -y
          cargo install --force --locked cargo-make
          cargo install --force --locked duckscript_cli
          flutter config --enable-windows-desktop
          dart pub global activate protoc_plugin 21.1.2
          echo "$LOCALAPPDATA/Pub/Cache/bin" >> $GITHUB_PATH
          echo "$USERPROFILE/.cargo/bin" >> $GITHUB_PATH

      - name: Build KotoFlow for Windows
        shell: bash
        working-directory: frontend
        run: |
          cargo make --profile production-windows-x86 appflowy-windows

      - name: Archive Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildRoot = "frontend\appflowy_flutter\build\windows"

          if (-not (Test-Path $buildRoot)) {
            Write-Error "Каталог $buildRoot вообще не существует — flutter build windows ничего сюда не положил."
            exit 1
          }

          Write-Host "=== Реальная структура $buildRoot ==="
          Get-ChildItem -Path $buildRoot -Recurse -Directory | Select-Object FullName

          Write-Host "=== Все AppFlowy.exe внутри build/windows ==="
          $candidates = Get-ChildItem -Path $buildRoot -Recurse -File -Filter "AppFlowy.exe"
          $candidates | Select-Object FullName, Length

          if ($candidates.Count -eq 0) {
            Write-Error "AppFlowy.exe нигде не найден внутри $buildRoot."
            exit 1
          }

          $sourceDir = $null
          foreach ($c in $candidates) {
            $dir = $c.DirectoryName
            $hasData = Test-Path (Join-Path $dir "data")
            $dllCount = (Get-ChildItem -Path $dir -Filter "*.dll" -File -ErrorAction SilentlyContinue).Count
            Write-Host "Кандидат: $dir | data/: $hasData | dll: $dllCount"
            if ($hasData -and $dllCount -gt 0) { $sourceDir = $dir }
          }

          if (-not $sourceDir) {
            Write-Error "Ни один AppFlowy.exe не лежит рядом с data/ и .dll — полного бандла нет нигде в build/windows."
            exit 1
          }

          Write-Host "Используем как источник: $sourceDir"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $stageDir = "dist\AppFlowy"
          if (Test-Path $stageDir) { Remove-Item $stageDir -Recurse -Force }
          robocopy $sourceDir $stageDir /E /NFL /NDL /NJH /NJS /NC /NS
          if ($LASTEXITCODE -ge 8) { Write-Error "robocopy завершился с ошибкой ($LASTEXITCODE)"; exit 1 }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = "$PWD\dist\KotoFlow-Windows-x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stageDir, $zipPath, [System.IO.Compression.CompressionLevel]::Optimal, $false)

          $zipItem = Get-Item $zipPath
          $sizeMB = [math]::Round($zipItem.Length / 1MB, 2)
          Write-Host "Архив создан: $zipPath ($sizeMB MB)"
          if ($sizeMB -lt 20) { Write-Error "Архив подозрительно маленький ($sizeMB MB)"; exit 1 }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KotoFlow-Windows-x64
          path: dist/KotoFlow-Windows-x64.zip
          retention-days: 14
